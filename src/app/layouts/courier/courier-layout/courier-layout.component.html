<div class="shell">
  <header class="shell__header">
    <div class="shell__brand">
      <img
        src="favicon.png"
        alt="Courier logo"
        class="shell__mark"
      />
      <span class="shell__wordmark">Courier</span>
    </div>
    <div class="shell__account">
      <span class="shell__name" *ngIf="firstName">{{ firstName }}</span>
      <button
        class="shell__logout"
        type="button"
        (click)="onLogout()"
        aria-label="Log out"
      >
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </header>

  <main class="shell__content">
    <router-outlet></router-outlet>
  </main>

  <nav class="shell__tabbar">
    <a
      class="tab"
      routerLink="/Courier"
      routerLinkActive="tab--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="tab__icon-wrap">
        <i class="bi bi-truck"></i>
        <span class="tab__badge" *ngIf="activeCount$ | async as count">{{
          count
        }}</span>
      </span>
      <span class="tab__label">Deliveries</span>
    </a>
    <a class="tab" routerLink="/Courier/Profile" routerLinkActive="tab--active">
      <i class="bi bi-person-circle"></i>
      <span class="tab__label">Profile</span>
    </a>
  </nav>
</div>
