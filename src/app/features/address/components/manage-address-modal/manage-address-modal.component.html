<div class="manage-modal__header">
  <div class="manage-modal__title-block">
    <div class="manage-modal__icon">
      <i class="bi bi-geo-alt-fill"></i>
    </div>
    <h5 class="manage-modal__title">
      {{ editMode ? "Edit Address" : "Add New Address" }}
    </h5>
  </div>
  <button class="manage-modal__close" (click)="modalRef.close()" type="button">
    <i class="bi bi-x-lg"></i>
  </button>
</div>

<div class="manage-modal__body">
  <form [formGroup]="addressForm" (ngSubmit)="onSubmit()">
    <!-- Address Line 1 -->
    <div
      class="form-field"
      [class.form-field--error]="
        f['addressLine1'].touched && f['addressLine1'].invalid
      "
    >
      <label class="form-field__label" for="addressLine1">Address Line 1</label>
      <div class="form-field__input-wrap">
        <i class="bi bi-signpost-2 form-field__icon"></i>
        <input
          class="form-field__input"
          type="text"
          id="addressLine1"
          formControlName="addressLine1"
          placeholder="e.g. 12 Nile Street, Apt 4"
        />
      </div>
      <div
        class="form-field__error"
        *ngIf="f['addressLine1'].touched && f['addressLine1'].invalid"
      >
        <i class="bi bi-exclamation-circle"></i>
        <span *ngIf="f['addressLine1'].errors?.['required']"
          >Address line 1 is required</span
        >
        <span *ngIf="f['addressLine1'].errors?.['maxlength']"
          >Max 255 characters</span
        >
      </div>
    </div>

    <!-- Address Line 2 -->
    <div class="form-field">
      <label class="form-field__label" for="addressLine2"
        >Address Line 2 (optional)</label
      >
      <div class="form-field__input-wrap">
        <i class="bi bi-signpost form-field__icon"></i>
        <input
          class="form-field__input"
          type="text"
          id="addressLine2"
          formControlName="addressLine2"
          placeholder="Floor, landmark, etc."
        />
      </div>
    </div>

    <!-- City + Governorate -->
    <div class="form-row">
      <div
        class="form-field"
        [class.form-field--error]="f['city'].touched && f['city'].invalid"
      >
        <label class="form-field__label" for="city">City</label>
        <div class="form-field__input-wrap">
          <i class="bi bi-building form-field__icon"></i>
          <input
            class="form-field__input"
            type="text"
            id="city"
            formControlName="city"
            placeholder="e.g. Giza"
          />
        </div>
        <div
          class="form-field__error"
          *ngIf="f['city'].touched && f['city'].invalid"
        >
          <i class="bi bi-exclamation-circle"></i>
          <span *ngIf="f['city'].errors?.['required']">City is required</span>
        </div>
      </div>

      <div class="form-field">
        <label class="form-field__label" for="governorate">Governorate</label>
        <div class="form-field__input-wrap">
          <i class="bi bi-map form-field__icon"></i>
          <input
            class="form-field__input"
            type="text"
            id="governorate"
            formControlName="governorate"
            placeholder="e.g. Giza Governorate"
          />
        </div>
      </div>
    </div>

    <!-- Type -->
    <div class="form-field">
      <label class="form-field__label" for="addressType">Address Type</label>
      <div class="form-field__input-wrap">
        <i class="bi bi-tag form-field__icon"></i>
        <select
          class="form-field__input form-field__select"
          id="addressType"
          formControlName="addressType"
        >
          <option *ngFor="let option of typeOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
        <i class="bi bi-chevron-down form-field__chevron"></i>
      </div>
    </div>

    <!-- Default -->
    <div class="form-field form-field--switch">
      <label class="form-check-label" for="isDefault"
        >Set as default address</label
      >
      <div class="form-check form-switch">
        <input
          class="form-check-input"
          type="checkbox"
          id="isDefault"
          formControlName="isDefault"
        />
      </div>
    </div>

    <!-- Actions -->
    <div class="manage-modal__actions">
      <button type="button" class="btn-cancel" (click)="modalRef.close()">
        Cancel
      </button>
      <button
        type="submit"
        class="btn-save"
        [disabled]="addressForm.invalid || isSubmitting"
      >
        <span *ngIf="isSubmitting" class="spinner"></span>
        <i *ngIf="!isSubmitting" class="bi bi-check-lg"></i>
        {{ isSubmitting ? "Saving..." : "Save Address" }}
      </button>
    </div>
  </form>
</div>
